version: "3.9"

services:

  # ============================================================
  # SEAWEEDFS
  # ============================================================

  master:
    image: chrislusf/seaweedfs
    container_name: seaweedfs-master
    hostname: master
    restart: unless-stopped

    ports:
      - "9333:9333"
      - "19333:19333"
      - "9324:9324"

    command:
      - master
      - -ip=master
      - -ip.bind=0.0.0.0
      - -metricsPort=9324

    profiles:
      - core
      - s3


  volume:
    image: chrislusf/seaweedfs
    container_name: seaweedfs-volume
    hostname: volume
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "18080:18080"
      - "9325:9325"

    command:
      - volume
      - -ip=volume
      - -master=master:9333
      - -ip.bind=0.0.0.0
      - -port=8080
      - -metricsPort=9325
      - -dir=/data

    volumes:
      - seawedfs:/data

    depends_on:
      - master

    profiles:
      - core
      - s3


  filer:
    image: chrislusf/seaweedfs
    container_name: seaweedfs-filer
    hostname: filer
    restart: unless-stopped

    ports:
      - "8888:8888"
      - "18888:18888"
      - "9326:9326"

    command:
      - filer
      - -ip=filer
      - -master=master:9333
      - -ip.bind=0.0.0.0
      - -metricsPort=9326

    depends_on:
      - master
      - volume

    profiles:
      - core
      - s3


  s3:
    image: chrislusf/seaweedfs
    container_name: s3
    hostname: s3
    restart: unless-stopped

    depends_on:
      - filer

    command:
      - s3
      - -filer=filer:8888
      - -config=/etc/seaweedfs/s3.json

    ports:
      - "8333:8333"

    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

    profiles:
      - core
      - s3

  webdav:
    image: chrislusf/seaweedfs
    container_name: seaweedfs-webdav
    restart: unless-stopped

    ports:
      - "7333:7333"

    command:
      - webdav
      - -filer=filer:8888

    depends_on:
      - master
      - volume
      - filer

    profiles:
      - core
      - s3


  admin:
    image: chrislusf/seaweedfs
    container_name: seaweedfs-admin
    restart: unless-stopped

    ports:
      - "23646:23646"

    command:
      - admin
      - -master=master:9333

    depends_on:
      - master
      - volume
      - filer

    profiles:
      - core
      - s3


  # ============================================================
  # SEAWEEDFS INITIALIZATION
  # ============================================================
  seawedfs-init:
    image: amazon/aws-cli
    container_name: seawedfs-init

    depends_on:
      - s3

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Waiting for SeaweedFS S3..."

        until aws s3api list-buckets \
          --endpoint-url http://s3:8333 \
          >/dev/null 2>&1
        do
          sleep 2
        done

        echo "SeaweedFS S3 is ready."

        if ! aws s3api head-bucket \
          --bucket rawjobs \
          --endpoint-url http://s3:8333
        then
          echo "Creating rawjobs bucket..."

          aws s3api create-bucket \
            --bucket rawjobs \
            --endpoint-url http://s3:8333
        fi

        if ! aws s3api head-bucket \
          --bucket warehouse \
          --endpoint-url http://s3:8333
        then
          echo "Creating warehouse bucket..."

          aws s3api create-bucket \
            --bucket warehouse \
            --endpoint-url http://s3:8333
        fi

        echo "Buckets ready:"

        aws s3api list-buckets \
          --endpoint-url http://s3:8333

    profiles:
      - core
      - s3

  # ============================================================
  # PROMETHEUS
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.21.0
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9000:9090"

    volumes:
      - ./prometheus:/etc/prometheus:ro

    command:
      - --web.enable-lifecycle
      - --config.file=/etc/prometheus/prometheus.yml

    depends_on:
      - s3

    profiles:
      - core
      - s3


  # ============================================================
  # APACHE POLARIS
  # ============================================================

  polaris:
    image: apache/polaris:latest
    container_name: iceberg-polaris
    hostname: polaris
    restart: unless-stopped

    ports:
      - "8181:8181"
      - "8182:8182"

    depends_on:
      seawedfs-init:
        condition: service_completed_successfully

    environment:

      # ----------------------------------------------------------
      # Polaris bootstrap
      # realm, client-id, client-secret
      # ----------------------------------------------------------
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cret"

      polaris.realm-context.realms: "POLARIS"

      # Disable telemetry
      quarkus.otel.sdk.disabled: "true"

      # ----------------------------------------------------------
      # S3 / SeaweedFS
      # ----------------------------------------------------------
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password

      # ----------------------------------------------------------
      # Allow S3-compatible storage
      # ----------------------------------------------------------
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      polaris.features."ALLOW_SETTING_S3_ENDPOINTS": "true"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8182/q/health

      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    profiles:
      - core
      - spark


  # ============================================================
  # POLARIS INITIALIZATION
  # ============================================================
  polaris-init:
    image: alpine:3.21
    container_name: polaris-init
    restart: "no"

    depends_on:
      polaris:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        apk add --no-cache curl jq

        echo "=========================================="
        echo "Polaris initialization"
        echo "=========================================="

        echo "Requesting Polaris token..."

        TOKEN=$$(curl -sf \
          -X POST \
          http://polaris:8181/api/catalog/v1/oauth/tokens \
          -H "Content-Type: application/x-www-form-urlencoded" \
          --user root:s3cret \
          -d "grant_type=client_credentials" \
          -d "scope=PRINCIPAL_ROLE:ALL" \
          | jq -r '.access_token')

        if [ -z "$${TOKEN}" ] || [ "$${TOKEN}" = "null" ]; then
          echo "ERROR: Failed to obtain Polaris token."
          exit 1
        fi

        echo "Token acquired."

        echo
        echo "=== Existing catalogs ==="

        curl -sf \
          http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $${TOKEN}" \
          | jq .

        echo
        echo "=== Creating warehouse catalog ==="

        HTTP_CODE=$$(curl -s \
          -o /tmp/catalog-response.json \
          -w "%{http_code}" \
          -X POST \
          http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $${TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{
            "catalog": {
              "name": "warehouse",
              "type": "INTERNAL",
              "properties": {
                "default-base-location": "s3://warehouse/",
                "s3.endpoint": "http://s3:8333",
                "s3.path-style-access": "true"
              },
              "storageConfigInfo": {
                "storageType": "S3",
                "allowedLocations": [
                  "s3://warehouse/"
                ],
                "endpoint": "http://s3:8333",
                "pathStyleAccess": true,
                "stsUnavailable": true,
                "region": "us-east-1"
              }
            }
          }')

        echo "HTTP $${HTTP_CODE}"
        cat /tmp/catalog-response.json
        echo

        case "$${HTTP_CODE}" in
          200|201)
            echo "Catalog created."
            ;;
          409)
            echo "Catalog already exists."
            ;;
          *)
            echo "ERROR: Failed to create catalog."
            exit 1
            ;;
        esac

        echo
        echo "=== Polaris catalogs ==="

        curl -sf \
          http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $${TOKEN}" \
          | jq .

        echo
        echo "Polaris initialization complete."

  # ============================================================
  # SPARK MASTER
  # ============================================================

  spark:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: spark
    hostname: spark
    restart: unless-stopped

    ports:
      - "7077:7077"
      - "8081:8080"

    environment:
      SPARK_NO_DAEMONIZE: "true"

      # Official Spark image does not have a writable
      # normal home directory.
      HOME: /tmp

    volumes:
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./infra/spark/jobs:/opt/spark/jobs:ro

    command:
      - /opt/spark/sbin/start-master.sh

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    depends_on:
      polaris-init:
        condition: service_completed_successfully

    profiles:
      - core
      - spark


  # ============================================================
  # SPARK WORKER
  # ============================================================

  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped

    depends_on:
      spark:
        condition: service_healthy

    ports:
      - "8082:8081"

    environment:
      SPARK_NO_DAEMONIZE: "true"

      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"

      HOME: /tmp

    volumes:
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./infra/spark/jobs:/opt/spark/jobs:ro

    command:
      - /opt/spark/sbin/start-worker.sh
      - spark://spark:7077

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8081

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    profiles:
      - core
      - spark


  # ============================================================
  # SPARK TEST / SUBMITTER
  # ============================================================

  spark-init:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: spark-init
    restart: "no"

    depends_on:

      spark:
        condition: service_healthy

      spark-worker:
        condition: service_healthy

      polaris-init:
        condition: service_completed_successfully

    environment:
      HOME: /tmp

    volumes:
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./infra/spark/jobs:/opt/spark/jobs:ro

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark:7077
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
      - /opt/spark/jobs/listen.py
      # - /opt/spark/jobs/test.py

    profiles:
      - core
      - spark


  # ============================================================
  # KAFKA
  # ============================================================

  broker:
    image: apache/kafka:latest
    container_name: broker
    hostname: broker
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    mem_limit: 1g

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        INTERNAL://:19092,
        EXTERNAL://:9092,
        VPN://:29092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://broker:19092,
        EXTERNAL://localhost:9092,
        VPN://10.200.200.1:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        VPN:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_RETENTION_HOURS: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 6

    volumes:
      - kafka_data:/var/lib/kafka/data

    profiles:
      - core


  # ============================================================
  # AIRFLOW POSTGRES
  # ============================================================

  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    profiles:
      - core
      - orchestrator

  airflow:
    build:
      context: .
      dockerfile: ./infra/airflow/Dockerfile

    image: jobscrapper-airflow:0.1

    container_name: airflow
    hostname: airflow
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_started

      broker:
        condition: service_started

      spark:
        condition: service_healthy

      spark-worker:
        condition: service_healthy

    ports:
      - "3000:8080"

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow_password@airflow-postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: 8tJ0REESeLns1m5Z2lPab5MtYMyXpqBzEd3j6LPg_aI=

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      KAFKA_BOOTSTRAP_SERVERS: broker:19092

      AIRFLOW_CONN_SPARK_DEFAULT: >-
        spark://spark:7077

      AIRFLOW_CONN_KAFKA_DEFAULT: >-
        kafka://broker:19092

    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - ./infra/spark/jobs:/jobs/spark:ro

      # DockerOperator
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - airflow
      - standalone

    group_add:
      - "114"

    profiles:
      - core
      - orchestrator


    # ============================================================
  # AIRFLOW INIT
  # ============================================================

  airflow-init:
    image: jobscrapper-airflow:0.1
    container_name: airflow-init
    restart: "no"

    depends_on:
      airflow-postgres:
        condition: service_started
      broker:
        condition: service_started
      spark:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow_password@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 8tJ0REESeLns1m5Z2lPab5MtYMyXpqBzEd3j6LPg_aI=
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

    command:
      - bash
      - -c
      - |
        set -e

        echo "=========================================="
        echo "Airflow initialization"
        echo "=========================================="

        echo "Waiting for Airflow database..."
        airflow db migrate

        echo "Creating Spark connection..."

        airflow connections delete spark_default || true

        airflow connections add spark_default \
          --conn-type spark \
          --conn-host spark \
          --conn-port 7077

        echo "Creating Kafka connection..."

        airflow connections delete kafka_default || true

        airflow connections add kafka_default \
          --conn-type kafka \
          --conn-host broker \
          --conn-port 19092

        echo "Creating Docker connection..."

        airflow connections delete docker_default || true

        airflow connections add docker_default \
          --conn-type docker \
          --conn-extra '{
            "docker_url": "unix://var/run/docker.sock"
          }'

        echo
        echo "=========================================="
        echo "Connections"
        echo "=========================================="

        airflow connections get spark_default
        airflow connections get kafka_default
        airflow connections get docker_default

        echo
        echo "Airflow initialization complete."

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    profiles:
      - core
      - orchestrator

# ================================================================
# VOLUMES
# ================================================================

volumes:
  kafka_data:
  airflow_postgres_data:
  airflow_logs:
  seawedfs: